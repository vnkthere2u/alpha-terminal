<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaTerminal</title>
<meta name="description" content="Daily institutional-grade macro brief: quant regime signals with AI synthesis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a19'/%3E%3Cpath d='M5 22l7-8 5 5 10-11' stroke='%233987e5' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--surface-2:#f0efec;
  --ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --series-1:#2a78d6;--series-1-soft:rgba(42,120,214,.12);
  --up:#006300;--down:#d03b3b;--warn:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d;--surface:#1a1a19;--surface-2:#232321;
    --ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
    --series-1:#3987e5;--series-1-soft:rgba(57,135,229,.16);
    --up:#0ca30c;--down:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#232321;
  --ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --series-1:#3987e5;--series-1-soft:rgba(57,135,229,.16);
  --up:#0ca30c;--down:#e66767;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--series-1)}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 9px;cursor:pointer}
button[aria-pressed="true"]{background:var(--series-1-soft);border-color:var(--series-1)}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0}
h2{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
h3{font-size:15px;margin:0 0 6px}
.label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.hero{font-size:28px;font-weight:800;line-height:1.15;margin:2px 0 6px}
.ink2{color:var(--ink-2)}
.muted{color:var(--muted)}
.small{font-size:12px}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:4px 0}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-right:4px;white-space:nowrap}
.tag.new{background:var(--series-1-soft);color:var(--series-1)}
.trend{border-left:3px solid var(--series-1);padding:2px 0 2px 10px;margin:10px 0}
.trend.fading,.trend.broken{border-left-color:var(--axis)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}
.scroll{overflow-x:auto}
.sev{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.sev i{display:inline-block;height:6px;border-radius:3px;background:var(--series-1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap;display:none;z-index:5}
.tip b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bar-track{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0}
.bar-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2)}
.bar-zone{position:absolute;top:0;bottom:0;background:var(--grid)}
details summary{cursor:pointer;color:var(--ink-2)}
pre.news{white-space:pre-wrap;font:12px/1.6 var(--mono);color:var(--ink-2);margin:8px 0 0}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin:28px 0 8px;font-size:12px;color:var(--muted)}
.rel-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">AlphaTerminal<small id="subtitle">Macro regime monitor</small></div>
    <div class="controls">
      <label class="small muted" for="dateSel">Edition</label>
      <select id="dateSel" aria-label="Choose edition"></select>
      <button id="themeBtn" type="button" aria-label="Toggle colour theme">◐ Theme</button>
    </div>
  </header>
  <main id="app"><div class="empty">Loading latest brief…</div></main>
  <footer id="foot"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
